:root { --violet: #8B5CF6; --text: #EEEAFB; --dim: #8E8AA8; --bg: #000; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text); font-family: Inter, system-ui, sans-serif; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; cursor: none; }
body:hover canvas { cursor: default; }
#ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 9vh; gap: 18px; transition: opacity .8s ease; }
#ov.hide { opacity: 0; pointer-events: none; }
#ov h1 { margin: 0; font-weight: 900; font-size: clamp(36px, 6vw, 92px); letter-spacing: .12em; background: linear-gradient(#fff, #C4B5FD); -webkit-background-clip: text; background-clip: text; color: transparent; }
#ov .k { font-family: "JetBrains Mono", monospace; color: #F5C451; letter-spacing: .4em; font-size: clamp(11px, 1.1vw, 16px); }
#play { font: 600 18px Inter, sans-serif; color: #0b0716; background: #C4B5FD; border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer; opacity: .35; transition: transform .2s, opacity .3s, background .2s; display: flex; gap: 10px; align-items: center; }
#play.ready { opacity: 1; }
#play.ready:hover { transform: scale(1.05); background: #fff; }
#status, #hint { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--dim); letter-spacing: .05em; text-align: center; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 24px; display: flex; gap: 16px; align-items: center; opacity: 0; transition: opacity .4s; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
#ui.show { opacity: 1; }
#bar { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; cursor: pointer; position: relative; }
#fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--violet); border-radius: 3px; }
#tc { font: 13px "JetBrains Mono", monospace; color: var(--dim); min-width: 110px; text-align: right; }
#keys { font: 12px "JetBrains Mono", monospace; color: var(--dim); }
#end { position: fixed; right: 32px; top: 28px; opacity: 0; pointer-events: none; transition: opacity .6s; }
#end.show { opacity: 1; pointer-events: auto; }
#replay { font: 600 14px Inter, sans-serif; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 10px 20px; cursor: pointer; }
@media (max-width: 640px) { #keys { display: none; } #ui { padding: 12px 16px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ov">
  <div class="k">A TRAILER FOR THE LAB</div>
  <h1>ERNESTO</h1>
  <button id="play" disabled><svg width="14" height="16" viewBox="0 0 14 16"><path d="M0 0L14 8L0 16Z" fill="currentColor"/></svg> Play trailer</button>
  <div id="status">composing the score…</div>
  <div id="hint">sound on · F fullscreen · space pause · ← → seek</div>
</div>
<div id="ui"><div id="bar"><div id="fill"></div></div><div id="tc">0:00</div><div id="keys">space · ← → · F · M · R</div></div>
<div id="end"><button id="replay">↻ Replay</button></div>
<script>
'use strict';
/* =========================================================================
   ERNESTO — trailer engine core
   Everything is a pure function of time t (seconds). No state between frames.
   ========================================================================= */

const W = 1920, H = 1080;
const DURATION = 106.7;

const C = {
  black: '#000000',
  bg: '#06050b',
  bg2: '#0c0a17',
  violet: '#8B5CF6',
  violetL: '#C4B5FD',
  violetXL: '#E4DCFF',
  violetD: '#5B21B6',
  gold: '#F5C451',
  goldD: '#B8862B',
  text: '#EEEAFB',
  dim: '#8E8AA8',
  faint: '#4B4868',
  green: '#4ADE80',
  red: '#F87171',
  blue: '#60A5FA',
  teal: '#2DD4BF',
  panel: 'rgba(20,17,34,0.86)',
  panelHi: 'rgba(30,26,50,0.92)',
  line: 'rgba(196,181,253,0.14)',
};
const F = {
  sans: 'Inter, system-ui, sans-serif',
  mono: '"JetBrains Mono", ui-monospace, monospace',
  serif: '"Instrument Serif", Georgia, serif',
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;

const E = {
  lin: x => x,
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inOutQuad: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inQuint: x => x ** 5,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackS: x => { const c1 = 3.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
};
// tween: value a→b while t moves t0→t1
const tw = (t, t0, t1, a, b, ease = E.outCubic) => lerp(a, b, ease(ramp(t, t0, t1)));
// window: fade in over fi after a, fade out over fo before b
const win = (t, a, b, fi = .3, fo = .3) =>
  Math.max(0, Math.min(E.outCubic(ramp(t, a, a + fi)), 1 - E.inCubic(ramp(t, b - fo, b))));
const pulse = (t, t0, dur) => (t < t0 ? 0 : Math.exp(-(t - t0) / dur));

/* ---------- deterministic randomness ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hash = (n) => { const r = mulberry32((n * 2654435761) | 0); r(); return r(); };
function vnoise(x, seed = 0) { // smooth 1D value noise in [-1,1]
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 1013) * 2 - 1, hash(i + 1 + seed * 1013) * 2 - 1, u);
}

/* ---------- canvas helpers ---------- */
function font(ctx, size, weight = 400, fam = F.sans, style = 'normal') {
  ctx.font = `${style} ${weight} ${size}px ${fam}`;
}
function txt(ctx, s, x, y, o = {}) {
  const { size = 32, weight = 400, fam = F.sans, color = C.text, align = 'left', base = 'alphabetic',
    alpha = 1, track = 0, style = 'normal' } = o;
  if (alpha <= 0) return 0;
  ctx.save();
  font(ctx, size, weight, fam, style);
  ctx.letterSpacing = track + 'px';
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.globalAlpha *= alpha;
  ctx.fillStyle = color;
  // letterSpacing adds trailing space; compensate for centered / right text
  const dx = align === 'center' ? track / 2 : align === 'right' ? track : 0;
  ctx.fillText(s, x + dx, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function measure(ctx, s, size, weight = 400, fam = F.sans, track = 0, style = 'normal') {
  ctx.save(); font(ctx, size, weight, fam, style); ctx.letterSpacing = track + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrap(ctx, s, maxW, size, weight = 400, fam = F.sans) {
  ctx.save(); font(ctx, size, weight, fam); ctx.letterSpacing = '0px';
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  ctx.restore(); return lines;
}
// typewriter: number of chars visible
const typed = (t, t0, cps, s) => s.slice(0, Math.max(0, Math.floor((t - t0) * cps)));

function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function panel(ctx, x, y, w, h, o = {}) {
  const { r = 22, fill = C.panel, stroke = 'rgba(255,255,255,0.07)', alpha = 1, shadow = true, glow = null } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18; }
  rrect(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.shadowColor = 'transparent';
  // subtle top sheen
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,0.05)'); g.addColorStop(0.25, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = glow || stroke; ctx.stroke();
  ctx.restore();
}
function windowChrome(ctx, x, y, w, h, title, alpha = 1) {
  panel(ctx, x, y, w, h, { alpha, fill: 'rgba(14,12,24,0.94)' });
  ctx.save(); ctx.globalAlpha *= alpha;
  const cols = ['#FF5F57', '#FEBC2E', '#28C840'];
  cols.forEach((c, i) => { ctx.beginPath(); ctx.arc(x + 30 + i * 24, y + 28, 7, 0, TAU); ctx.fillStyle = c; ctx.globalAlpha = alpha * .85; ctx.fill(); });
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x, y + 55, w, 1.5);
  ctx.restore();
  txt(ctx, title, x + w / 2, y + 35, { size: 17, fam: F.mono, color: C.dim, align: 'center', alpha });
}
function glow(ctx, x, y, r, color, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function check(ctx, x, y, s, color = C.green, p = 1, lw = null) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw || s * 0.18; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pts = [[-0.45, 0.02], [-0.12, 0.34], [0.48, -0.32]];
  const L1 = Math.hypot(.33, .32), L2 = Math.hypot(.6, .66), L = L1 + L2, d = p * L;
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  if (d <= L1) { const k = d / L1; ctx.lineTo(x + lerp(pts[0][0], pts[1][0], k) * s, y + lerp(pts[0][1], pts[1][1], k) * s); }
  else { ctx.lineTo(x + pts[1][0] * s, y + pts[1][1] * s); const k = (d - L1) / L2; ctx.lineTo(x + lerp(pts[1][0], pts[2][0], k) * s, y + lerp(pts[1][1], pts[2][1], k) * s); }
  ctx.stroke(); ctx.restore();
}
function cross(ctx, x, y, s, color = C.red, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s * 0.18; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .35, y - s * .35); ctx.lineTo(x + s * .35, y + s * .35);
  ctx.moveTo(x + s * .35, y - s * .35); ctx.lineTo(x - s * .35, y + s * .35); ctx.stroke(); ctx.restore();
}

/* ---------- ERNESTO, the character ----------
   Geometry measured from the Ernesto avatar (assets/avatar.png):
   body #8B5CF6 squircle, eyes at ±0.138s, -0.086s, radius 0.069s.          */
function ernesto(ctx, x, y, s, o = {}) {
  const { blink = 0, lx = 0, ly = 0, mood = 'neutral', alpha = 1, rot = 0, sq = 0, glowA = 0.55,
    top = '#A07CFA', bot = '#7646EA', eyesOnly = false, eyeGlow = 0 } = o;
  if (alpha <= 0 || s <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.scale(1 + sq * .6, 1 - sq);
  const r = s * 0.27;
  if (!eyesOnly) {
    if (glowA > 0) glow(ctx, 0, s * 0.05, s * 1.25, hexA('#8B5CF6', .55 * glowA));
    // soft contact shadow
    ctx.save(); ctx.globalAlpha *= .35; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(0, s * 0.62, s * 0.42, s * 0.06, 0, 0, TAU); ctx.filter = `blur(${Math.max(1, s * .03)}px)`; ctx.fill(); ctx.restore();
    const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
    g.addColorStop(0, top); g.addColorStop(1, bot);
    rrect(ctx, -s / 2, -s / 2, s, s, r); ctx.fillStyle = g; ctx.fill();
    // rim light + top sheen
    const g2 = ctx.createLinearGradient(0, -s / 2, 0, 0);
    g2.addColorStop(0, 'rgba(255,255,255,0.22)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
    rrect(ctx, -s / 2 + s * .025, -s / 2 + s * .02, s - s * .05, s * .45, r * .9); ctx.fillStyle = g2; ctx.fill();
    rrect(ctx, -s / 2, -s / 2, s, s, r); ctx.lineWidth = Math.max(1, s * .008); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.stroke();
    // bottom inner shade
    const g3 = ctx.createLinearGradient(0, s * .1, 0, s / 2);
    g3.addColorStop(0, 'rgba(40,10,90,0)'); g3.addColorStop(1, 'rgba(40,10,90,0.28)');
    rrect(ctx, -s / 2, -s / 2, s, s, r); ctx.fillStyle = g3; ctx.fill();
  }
  const ex = s * 0.138, ey = -s * 0.086 + ly * s * 0.035, er = s * 0.069, ox = lx * s * 0.045;
  const eyeCol = eyesOnly ? '#EDE6FF' : '#140E26';
  if (eyeGlow > 0) { glow(ctx, -ex + ox, ey, er * 5, hexA('#C4B5FD', .5 * eyeGlow)); glow(ctx, ex + ox, ey, er * 5, hexA('#C4B5FD', .5 * eyeGlow)); }
  for (const side of [-1, 1]) {
    const cx = side * ex + ox, cy = ey;
    const m = (mood === 'wink' && side === 1) ? 'happy' : mood;
    if (m === 'happy') {
      ctx.beginPath(); ctx.lineCap = 'round'; ctx.strokeStyle = eyeCol; ctx.lineWidth = er * 0.62;
      ctx.arc(cx, cy + er * 0.55, er * 0.95, Math.PI * 1.18, Math.PI * 1.82); ctx.stroke();
    } else {
      const k = clamp(1 - blink, 0, 1);
      if (k < 0.12) {
        ctx.beginPath(); ctx.lineCap = 'round'; ctx.strokeStyle = eyeCol; ctx.lineWidth = er * 0.42;
        ctx.moveTo(cx - er * .95, cy + er * .15); ctx.lineTo(cx + er * .95, cy + er * .15); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.ellipse(cx, cy, er, er * k, 0, 0, TAU); ctx.fillStyle = eyeCol; ctx.fill();
        if (k > .5 && !eyesOnly) {
          ctx.beginPath(); ctx.arc(cx - er * .3, cy - er * .32 * k, er * .3, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
          ctx.beginPath(); ctx.arc(cx + er * .32, cy + er * .3 * k, er * .12, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
        }
      }
    }
  }
  ctx.restore();
}
// blink helper: returns 0..1 eyelid closure for a list of blink times
function blinkAt(t, times, dur = 0.16) {
  let b = 0;
  for (const bt of times) { const d = Math.abs(t - bt); if (d < dur) b = Math.max(b, 1 - d / dur); }
  return E.inOutQuad(b);
}
// smooth piecewise look path [[t, x, y], ...]
function lookPath(t, keys, sp = 0.18) {
  let x = 0, y = 0;
  for (const [kt, kx, ky] of keys) {
    const p = E.inOutCubic(ramp(t, kt, kt + sp));
    x = lerp(x, kx, p); y = lerp(y, ky, p);
  }
  return [x, y];
}
const idleBob = (t, amp = 1, ph = 0) => Math.sin(t * 2.1 + ph) * amp;

/* ---------- common backgrounds ---------- */
function bgBase(ctx, c1 = C.bg2, c2 = C.bg) {
  const g = ctx.createRadialGradient(W / 2, H * .35, 0, W / 2, H * .5, W * .75);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function dotGrid(ctx, t, a = 1, sp = 48, ox = 0, oy = 0, col = '196,181,253') {
  if (a <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(${col},${0.10 * a})`;
  const sx = ((ox % sp) + sp) % sp, sy = ((oy % sp) + sp) % sp;
  for (let y = -sp + sy; y < H + sp; y += sp)
    for (let x = -sp + sx; x < W + sp; x += sp) ctx.fillRect(x, y, 2, 2);
  ctx.restore();
}
function dust(ctx, t, n = 60, seed = 1, a = 1, col = '196,181,253') {
  if (a <= 0) return;
  const r = mulberry32(seed);
  ctx.save();
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sp = 6 + r() * 22, sz = .6 + r() * 2.2, ph = r() * TAU, z = r();
    const x = (x0 + t * sp * (z + .3) + W) % W, y = (y0 - t * sp * .6 + H * 10) % H;
    const al = (0.18 + 0.5 * z) * (0.5 + 0.5 * Math.sin(t * 1.3 + ph)) * a;
    ctx.fillStyle = `rgba(${col},${al})`;
    ctx.beginPath(); ctx.arc(x, y + Math.sin(t + ph) * 8, sz * (z + .4), 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function rays(ctx, x, y, t, a = 1, col = '139,92,246', n = 14, len = 1400) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.06);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const ang = i / n * TAU, w = 0.05 + 0.04 * Math.sin(i * 3.7 + t * .5);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
    g.addColorStop(0, `rgba(${col},${0.16 * a})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, len, ang - w, ang + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
// expanding shockwave ring
function shock(ctx, x, y, t, t0, o = {}) {
  const { dur = 1.1, r0 = 100, r1 = 1300, col = '196,181,253', w = 26 } = o;
  const p = ramp(t, t0, t0 + dur); if (p <= 0 || p >= 1) return;
  const e = E.outExpo(p), r = lerp(r0, r1, e);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(${col},${(1 - p) * .6})`; ctx.lineWidth = w * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore();
}
// particle burst, deterministic
function burst(ctx, x, y, t, t0, o = {}) {
  const { n = 120, seed = 7, speed = 900, life = 1.8, col = '196,181,253', size = 3, drag = 2.6, spread = 0 } = o;
  const age = t - t0; if (age < 0 || age > life) return;
  const r = mulberry32(seed);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = r() * TAU, v = speed * (.25 + r() * .75), sz = size * (.4 + r() * 1.2), lf = life * (.5 + r() * .5);
    if (age > lf) continue;
    const d = v * (1 - Math.exp(-drag * age)) / drag + spread;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + 40 * age * age;
    const al = (1 - age / lf);
    ctx.fillStyle = `rgba(${col},${al})`;
    ctx.beginPath(); ctx.arc(px, py, sz * (1 - age / lf * .5), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- cinematic post-processing ---------- */
const FX = {
  grain: [], vig: null, small: null, sctx: null,
  init() {
    for (let k = 0; k < 8; k++) {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d'), id = g.createImageData(256, 256), r = mulberry32(99 + k);
      for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
      g.putImageData(id, 0, 0); this.grain.push(c);
    }
    this.vig = document.createElement('canvas'); this.vig.width = W; this.vig.height = H;
    const v = this.vig.getContext('2d');
    const g = v.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .72);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.72)');
    v.fillStyle = g; v.fillRect(0, 0, W, H);
    this.small = document.createElement('canvas'); this.small.width = 480; this.small.height = 270;
    this.sctx = this.small.getContext('2d');
    this.layerA = document.createElement('canvas'); this.layerA.width = W; this.layerA.height = H;
    this.layerB = document.createElement('canvas'); this.layerB.width = W; this.layerB.height = H;
  },
  bloom(ctx, canvas, amt) {
    if (amt <= 0) return;
    const s = this.sctx; s.save(); s.clearRect(0, 0, 480, 270);
    s.filter = 'blur(5px) brightness(1.15)'; s.drawImage(canvas, 0, 0, 480, 270); s.restore();
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = amt;
    ctx.drawImage(this.small, 0, 0, W, H); ctx.restore();
  },
  post(ctx, canvas, t, o = {}) {
    const { bloom = 0.32, grain = 0.07, vignette = 1, letterbox = 0, flash = 0, flashCol = '255,255,255' } = o;
    this.bloom(ctx, canvas, bloom);
    if (vignette > 0) { ctx.save(); ctx.globalAlpha = vignette; ctx.drawImage(this.vig, 0, 0); ctx.restore(); }
    if (grain > 0) {
      const tile = this.grain[Math.floor(t * 24) % 8];
      ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = grain;
      const off = Math.floor(hash(Math.floor(t * 24)) * 256);
      ctx.translate(-off, -off);
      ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();

'use strict';
/* =========================================================================
   ERNESTO — procedural score + sound design
   Rendered once with an OfflineAudioContext, then played back as a buffer,
   so picture and sound share one clock and the trailer can be scrubbed.
   ========================================================================= */
const SR = 48000;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

async function composeScore(onProgress) {
  const len = Math.ceil(DURATION * SR) + SR;
  const ac = new OfflineAudioContext(2, len, SR);
  const R = mulberry32(2026);

  /* ---- mix buses ---- */
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .22;
  const master = ac.createGain(); master.gain.value = .85;
  master.connect(comp); comp.connect(ac.destination);
  // reverb: generated impulse response
  const conv = ac.createConvolver();
  const irLen = SR * 3.6, ir = ac.createBuffer(2, irLen, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < irLen; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / irLen, 3.2) * (i < 200 ? i / 200 : 1); }
  conv.buffer = ir;
  const verb = ac.createGain(); verb.gain.value = .55; conv.connect(verb); verb.connect(master);
  // tempo delay for arps
  const dly = ac.createDelay(2); dly.delayTime.value = .375;
  const fb = ac.createGain(); fb.gain.value = .32; const dlyOut = ac.createGain(); dlyOut.gain.value = .35;
  const dlyLp = ac.createBiquadFilter(); dlyLp.type = 'lowpass'; dlyLp.frequency.value = 3200;
  dly.connect(dlyLp); dlyLp.connect(fb); fb.connect(dly); dlyLp.connect(dlyOut); dlyOut.connect(master);
  const music = ac.createGain(); music.gain.value = 1; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = .9; sfx.connect(master);
  // pad bus with sidechain-style ducking
  const padBus = ac.createGain(); padBus.connect(music);

  // just-in-time node creation (see render loop at the bottom)
  const Q = [];
  const sched = (t, fn) => Q.push([t, fn]);

  // shared noise
  const nb = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = nb.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }

  function out(node, { dest = music, pan = 0, send = 0, delay = 0 }) {
    let n = node;
    if (pan) { const p = ac.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(dest);
    if (send) { const s = ac.createGain(); s.gain.value = send; n.connect(s); s.connect(conv); }
    if (delay) { const s = ac.createGain(); s.gain.value = delay; n.connect(s); s.connect(dly); }
  }
  function envGain(t, dur, peak, a = .005, curve = 'exp') {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === 'exp') g.gain.exponentialRampToValueAtTime(Math.max(peak * 1e-4, 1e-5), t + dur);
    else { g.gain.setValueAtTime(peak, Math.max(t + a, t + dur - curve)); g.gain.linearRampToValueAtTime(0, t + dur); }
    return g;
  }
  function tone(t, dur, f, o = {}) {
    const { type = 'sine', gain = .2, a = .005, fEnd = null, fT = dur, lp = null, lpEnd = null, lpT = dur, q = .7, detune = 0, curve = 'exp' } = o;
    if (t < 0 || t > DURATION) return;
    sched(t, () => {
    const osc = ac.createOscillator(); osc.type = type; osc.frequency.setValueAtTime(f, t); osc.detune.value = detune;
    if (fEnd) osc.frequency.exponentialRampToValueAtTime(fEnd, t + fT);
    let n = osc;
    if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = q; fl.frequency.setValueAtTime(lp, t); if (lpEnd) fl.frequency.exponentialRampToValueAtTime(lpEnd, t + lpT); n.connect(fl); n = fl; }
    const g = envGain(t, dur, gain, a, curve); n.connect(g);
    out(g, o); osc.start(t); osc.stop(t + dur + .05);
    });
  }
  function noise(t, dur, o = {}) {
    const { gain = .2, a = .003, type = 'highpass', f = 1000, fEnd = null, fT = dur, q = .7, curve = 'exp', rate = 1 } = o;
    if (t < 0 || t > DURATION) return;
    sched(t, () => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; s.playbackRate.value = rate;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
    if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t + fT);
    const g = envGain(t, dur, gain, a, curve);
    s.connect(fl); fl.connect(g); out(g, o);
    s.start(t, R() * 2); s.stop(t + dur + .05);
    });
  }
  // swelling noise / pitch riser that stops dead at t1
  function riser(t0, t1, k = 1) { sched(t0, () => riserNow(t0, t1, k)); }
  function riserNow(t0, t1, k) {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 1.4;
    fl.frequency.setValueAtTime(300, t0); fl.frequency.exponentialRampToValueAtTime(7000, t1);

function wavFromBuffer(buf) {

/* =========================================================================

const black = ctx => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); };
const SCENES = [
  [0, T.cards, sColdOpen],
  [T.cards, T.cut, sOverload],
  [T.cut, 19.45, sLines],
  [19.45, T.ch[0], sReveal],
  [T.ch[0], T.ch[1], sResearch],
  [T.ch[1], T.ch[2], sCode],
  [T.ch[2], T.ch[3], sPaperwork],
  [T.ch[3], T.montage, sEducation],
  [T.montage, T.climax, sMontage],
  [T.climax, T.black, sClimax],
  [T.black, T.logo, black],

  [T.sting, DURATION + 5, sSting],

function renderFrame(ctx, canvas, t) {

  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';

  sh = Math.min(sh, 1.6);
  ctx.save();
  if (sh > .01) {
    const z = 1 + sh * .025;

    ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);

  ctx.restore();

  let bloom = .3; for (const h of CUE.hits) bloom += h.k * pulse(t, h.t, .35) * .5;
  const lb = t < T.impact ? 138 : tw(t, T.impact + .2, T.impact + 1.6, 138, 0, E.inOutCubic);
  let flash = pulse(t, T.impact, .22) * .9 + pulse(t, T.logo, .25) * .8 + pulse(t, T.ch[0], .1) * .5;
  FX.post(ctx, canvas, t, { bloom: Math.min(bloom, .9), grain: .075, letterbox: t > T.black ? 0 : lb, flash, flashCol: '235,225,255' });
}

      this.gain = this.ac.createGain(); this.gain.connect(this.ac.destination);
      await this.ac.resume();
      this.play(0); this.loop();
    };
    btn.addEventListener('click', go);
    window.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') { this.fs(); this.showUI(); return; }
      if (!this.started) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!btn.disabled) go(); } return; }
      if (e.code === 'Space') { e.preventDefault(); this.toggle(); }
      if (e.code === 'ArrowRight') this.seek(this.time() + 5);
      if (e.code === 'ArrowLeft') this.seek(this.time() - 5);
      if (e.key === 'r' || e.key === 'R') this.seek(0, true);
      if (e.key === 'm' || e.key === 'M') this.gain.gain.value = this.gain.gain.value > 0 ? 0 : 1;
      this.showUI();
    });
    canvas.addEventListener('dblclick', () => this.fs());
    canvas.addEventListener('click', () => this.started && this.toggle());
    window.addEventListener('mousemove', () => this.showUI());
    const bar = document.getElementById('bar');
    bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); this.seek((e.clientX - r.left) / r.width * DURATION, true); });
    document.getElementById('replay').addEventListener('click', () => this.seek(0, true));
  },
  fs() { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); },
  idle() {
    const tick = () => {
      if (this.started) return;
      const t = performance.now() / 1000;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      bgBase(ctx, '#140d28', '#040308'); rays(ctx, W / 2, 380, t, .7); dust(ctx, t, 60, 4, 1);
      ernesto(ctx, W / 2, 380 + idleBob(t, 6), 200, { glowA: .9, blink: blinkAt(t % 4.2, [3.9]), lx: Math.sin(t * .7) * .7, ly: Math.sin(t * .45) * .3 });
      FX.post(ctx, canvas, t, { bloom: .3, grain: .07 });
      requestAnimationFrame(tick);
    };
    tick();
  },
  time() {
    if (!this.playing) return this.offset;
    return this.ac.currentTime - this.startAt - (this.ac.outputLatency || 0);
  },
  play(from) {
    this.stopSrc();
    from = clamp(from, 0, DURATION - .01);
    const s = this.ac.createBufferSource(); s.buffer = this.buf; s.connect(this.gain);
    s.start(0, from); this.src = s; this.startAt = this.ac.currentTime - from; this.offset = from; this.playing = true; this.ended = false;
    document.getElementById('end').classList.remove('show');
  },
  stopSrc() { if (this.src) { try { this.src.stop(); } catch (e) { } this.src.disconnect(); this.src = null; } },
  pause() { this.offset = this.time(); this.stopSrc(); this.playing = false; },
  toggle() { if (this.ended) return this.seek(0, true); this.playing ? this.pause() : this.play(this.offset); this.showUI(); },
  seek(t, play = this.playing) { t = clamp(t, 0, DURATION - .01); if (play) this.play(t); else { this.offset = t; this.ended = false; } },
  showUI() {
    const ui = document.getElementById('ui'); ui.classList.add('show');
    clearTimeout(this._h); this._h = setTimeout(() => ui.classList.remove('show'), 2200);
  },
  loop() {
    const step = () => {
      let t = this.time();
      if (t >= DURATION) { t = DURATION - .001; if (this.playing) { this.pause(); this.offset = t; this.ended = true; document.getElementById('end').classList.add('show'); } }
      renderFrame(ctx, canvas, Math.max(0, t));
      document.getElementById('fill').style.width = (t / DURATION * 100) + '%';
      const f = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      document.getElementById('tc').textContent = `${f(Math.max(0, t))} / ${f(DURATION)}`;
      requestAnimationFrame(step);
    };
    step();
  },
};
boot();

</script>
</body>
</html>
